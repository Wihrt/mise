[settings]
auto_update = true

[tool_alias]
rtk = "github:rtk-ai/rtk"
rtk-proxy = "github:rtk-ai/rtk"

[tools]
adr-tools = "latest"
age = "latest"
ansible = { version = "latest", expose = ["ansible-core"] }
argo = "latest"
claude = "latest"
cocogitto = "latest"
container-structure-test = "latest"
dive = "latest"
fnox = "latest"
github-cli = "latest"
gitleaks = "latest"
glab = "latest"
go = "latest"
hadolint = "latest"
helm = "latest"
helm-docs = "latest"
herdr = "latest"
jq = "latest"
kind = "latest"
kubeconform = "latest"
kubectl = "latest"
kubectx = "latest"
kyverno = "latest"
lazydocker = "latest"
lazygit = "latest"
# Chaque nouvelle version de Node.js a son propre préfixe npm global :
# OpenCommit y est réinstallé à chaque installation de Node.
node = { version = "latest", postinstall = "npm install --global opencommit" }
opentofu = "latest"
# Recherche de code par intention (CLI et serveur MCP, déclaré à Claude Code
# par la tâche bootstrap). L'extra mcp porte le serveur.
"pipx:semble" = { version = "latest", extras = "mcp" }
prek = "latest"
process-compose = "latest"
# Les outils pypi (ansible, yamllint) résolvent leur interpréteur via le shim
# `python` : sans version globale, leur installation échoue hors d'un projet
# qui déclare python.
python = "3.14"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
sofka = "latest"
terraform-docs = "latest"
terramate = "latest"
tflint = "latest"
tfswitch = "latest"
tilt = "latest"
trivy = "latest"
uv = "latest"
vault = "latest"
yamlfmt = "latest"
yamllint = "latest"
yq = "latest"

[tools.rtk]
version = "latest"
# Hook Claude Code et RTK.md globaux ; --auto-patch évite toute question.
postinstall = "rtk init --global --auto-patch"
[tools.rtk.platforms]
linux-x64   = { asset_pattern = "rtk-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "rtk-aarch64-unknown-linux-gnu.tar.gz" }
macos-x64   = { asset_pattern = "rtk-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "rtk-aarch64-apple-darwin.tar.gz" }

[tools.rtk-proxy]
version = "latest"
[tools.rtk-proxy.platforms]
linux-x64   = { asset_pattern = "rtk-proxy-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "rtk-proxy-aarch64-unknown-linux-gnu.tar.gz" }
macos-x64   = { asset_pattern = "rtk-proxy-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "rtk-proxy-aarch64-apple-darwin.tar.gz" }

# OpenCommit lit sa configuration dans l'environnement ; la clé API
# (OCO_API_KEY) vient de fnox, voir tasks/bootstrap.
[env]
# Claude Code : réduction des tokens.
# Compaction automatique à 400K tokens plutôt qu'au bord de la fenêtre de 1M.
CLAUDE_CODE_AUTO_COMPACT_WINDOW = "400000"
# Pas de requête de fond pour le titre du terminal ni pour les suggestions de prompt.
CLAUDE_CODE_DISABLE_TERMINAL_TITLE = "1"
CLAUDE_CODE_ENABLE_PROMPT_SUGGESTION = "false"
# Cache des providers OpenTofu, partagé entre dépôts et copies de travail : un
# `tofu init` relie le provider déjà téléchargé au lieu de le reprendre.
# tasks/bootstrap crée le dossier.
TF_PLUGIN_CACHE_DIR = "{{env.HOME}}/.cache/opentofu/providers"
OCO_AI_PROVIDER = "anthropic"
OCO_MODEL = "claude-sonnet-5-5"

# docker.io crée le groupe docker et active dockerd ; docker-compose-v2 fournit
# `docker compose`. skopeo copie et inspecte les images sans démon. Le groupe
# docker est attribué par tasks/bootstrap, une fois le paquet installé.
[bootstrap.packages]
"apt:docker-buildx" = "latest"
"apt:docker-compose-v2" = "latest"
"apt:docker.io" = "latest"
"apt:skopeo" = "latest"

[bootstrap.mise_shell_activate]
bash = true

[dotfiles]
# mise.run installe mise dans ~/.local/bin : il doit être sur le PATH
# avant les blocs d'activation.
"~/.bash_profile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
# mise exec trouve fnox même si ce bloc précède l'activation de mise.
"~/.bashrc/fnox" = { block = 'eval "$(mise exec fnox -- fnox activate bash)"' }

# Harnais Claude Code et configuration rtk, posés en liens vers ce dépôt
# (`mise dot apply`, ou l'étape dotfiles de `mise bootstrap`). Toujours
# `symlink`, jamais `symlink-each` : un fichier créé sous un vrai dossier
# sortirait du dépôt. Ce qui n'est pas listé ici (skills synchronisés, mémoire,
# plugins, état de rtk) n'est pas touché.
"~/.claude/CLAUDE.md" = { source = "claude/CLAUDE.md", mode = "symlink" }
"~/.claude/RTK.md" = { source = "claude/RTK.md", mode = "symlink" }
"~/.claude/settings.json" = { source = "claude/settings.json", mode = "symlink" }
"~/.claude/agents" = { source = "claude/agents", mode = "symlink" }
# Un skill = une ligne ; `mise run lint:harness` refuse un skill sans entrée.
"~/.claude/skills/adr" = { source = "claude/skills/adr", mode = "symlink" }
"~/.claude/skills/cilium-network-policies" = { source = "claude/skills/cilium-network-policies", mode = "symlink" }
"~/.claude/skills/cnpg-operations" = { source = "claude/skills/cnpg-operations", mode = "symlink" }
"~/.claude/skills/compose-dev" = { source = "claude/skills/compose-dev", mode = "symlink" }
"~/.claude/skills/docker-build-strategies" = { source = "claude/skills/docker-build-strategies", mode = "symlink" }
"~/.claude/skills/dockerfile-restricted" = { source = "claude/skills/dockerfile-restricted", mode = "symlink" }
"~/.claude/skills/forge-gh" = { source = "claude/skills/forge-gh", mode = "symlink" }
"~/.claude/skills/forge-glab" = { source = "claude/skills/forge-glab", mode = "symlink" }
"~/.claude/skills/gitops-flux-argocd" = { source = "claude/skills/gitops-flux-argocd", mode = "symlink" }
"~/.claude/skills/helm-chart-authoring" = { source = "claude/skills/helm-chart-authoring", mode = "symlink" }
"~/.claude/skills/helm-render-diff-check" = { source = "claude/skills/helm-render-diff-check", mode = "symlink" }
"~/.claude/skills/hexagonal-go" = { source = "claude/skills/hexagonal-go", mode = "symlink" }
"~/.claude/skills/hexagonal-py" = { source = "claude/skills/hexagonal-py", mode = "symlink" }
"~/.claude/skills/k8s-restricted" = { source = "claude/skills/k8s-restricted", mode = "symlink" }
"~/.claude/skills/kubernetes-skill" = { source = "claude/skills/kubernetes-skill", mode = "symlink" }
"~/.claude/skills/opentofu-local" = { source = "claude/skills/opentofu-local", mode = "symlink" }
"~/.claude/skills/parallel-repo-plan-dispatch" = { source = "claude/skills/parallel-repo-plan-dispatch", mode = "symlink" }
"~/.claude/skills/readonly-cluster-and-secret-inspection" = { source = "claude/skills/readonly-cluster-and-secret-inspection", mode = "symlink" }
"~/.claude/skills/renovate-mr-review" = { source = "claude/skills/renovate-mr-review", mode = "symlink" }
"~/.claude/skills/repo-tooling" = { source = "claude/skills/repo-tooling", mode = "symlink" }
"~/.claude/skills/stacked-tdd-mr" = { source = "claude/skills/stacked-tdd-mr", mode = "symlink" }
"~/.claude/skills/terraform-skill" = { source = "claude/skills/terraform-skill", mode = "symlink" }
"~/.claude/skills/vault-kv-guarded-write" = { source = "claude/skills/vault-kv-guarded-write", mode = "symlink" }
"~/.config/rtk/config.toml" = { source = "rtk/config.toml", mode = "symlink" }

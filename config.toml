[settings]
auto_update = true

[tool_alias]
rtk = "github:rtk-ai/rtk"
rtk-proxy = "github:rtk-ai/rtk"

[tools]
adr-tools = "latest"
age = "latest"
ansible = { version = "latest", expose = ["ansible-core"] }
argo = "latest"
claude = "latest"
cocogitto = "latest"
container-structure-test = "latest"
dive = "latest"
fnox = "latest"
github-cli = "latest"
gitleaks = "latest"
glab = "latest"
go = "latest"
hadolint = "latest"
helm = "latest"
helm-docs = "latest"
herdr = "latest"
jq = "latest"
kind = "latest"
kubeconform = "latest"
kubectl = "latest"
kubectx = "latest"
kyverno = "latest"
lazydocker = "latest"
lazygit = "latest"
# Chaque nouvelle version de Node.js a son propre préfixe npm global :
# OpenCommit y est réinstallé à chaque installation de Node.
node = { version = "latest", postinstall = "npm install --global opencommit" }
opentofu = "latest"
prek = "latest"
process-compose = "latest"
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
sofka = "latest"
terraform-docs = "latest"
terramate = "latest"
tflint = "latest"
tfsec = "latest"
tfswitch = "latest"
uv = "latest"
vault = "latest"
yamlfmt = "latest"
yamllint = "latest"
yq = "latest"

[tools.rtk]
version = "latest"
# Hook Claude Code et RTK.md globaux ; --auto-patch évite toute question.
postinstall = "rtk init --global --auto-patch"
[tools.rtk.platforms]
linux-x64   = { asset_pattern = "rtk-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "rtk-aarch64-unknown-linux-gnu.tar.gz" }
macos-x64   = { asset_pattern = "rtk-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "rtk-aarch64-apple-darwin.tar.gz" }

[tools.rtk-proxy]
version = "latest"
[tools.rtk-proxy.platforms]
linux-x64   = { asset_pattern = "rtk-proxy-x86_64-unknown-linux-musl.tar.gz" }
linux-arm64 = { asset_pattern = "rtk-proxy-aarch64-unknown-linux-gnu.tar.gz" }
macos-x64   = { asset_pattern = "rtk-proxy-x86_64-apple-darwin.tar.gz" }
macos-arm64 = { asset_pattern = "rtk-proxy-aarch64-apple-darwin.tar.gz" }

# OpenCommit lit sa configuration dans l'environnement ; la clé API
# (OCO_API_KEY) vient de fnox, voir tasks/bootstrap.
[env]
OCO_AI_PROVIDER = "anthropic"
OCO_MODEL = "claude-sonnet-5-5"
# Les clients Docker (lazydocker, SDK) passent par le socket utilisateur de Podman.
KIND_EXPERIMENTAL_PROVIDER = "podman"
DOCKER_HOST = 'unix://{{ get_env(name="XDG_RUNTIME_DIR", default="/run/user/1000") }}/podman/podman.sock'

[shell_alias]
docker = "podman"

# Le podman de mise (github:podman-container-tools/podman) n'est qu'un client
# distant : le moteur vient d'apt. buildah et skopeo ne sont pas dans le
# registre mise. podman ne fait que recommander buildah, uidmap (mode sans
# root) et passt (réseau) : déclarés pour les postes sans Install-Recommends.
[bootstrap.packages]
"apt:buildah" = "latest"
"apt:passt" = "latest"
"apt:podman" = "latest"
"apt:skopeo" = "latest"
"apt:uidmap" = "latest"

# kind sans root : modules iptables chargés au démarrage (doc kind « rootless »).
[bootstrap.files."/etc/modules-load.d/iptables.conf"]
content = """
ip6_tables
ip6table_nat
ip_tables
iptable_nat
"""
owner = "root"
group = "root"
mode = "0644"

[bootstrap.mise_shell_activate]
bash = true

[dotfiles]
# mise.run installe mise dans ~/.local/bin : il doit être sur le PATH
# avant les blocs d'activation.
"~/.bash_profile/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
"~/.bashrc/local-bin" = { line = 'export PATH="$HOME/.local/bin:$PATH"', position = "prepend" }
# mise exec trouve fnox même si ce bloc précède l'activation de mise.
# Limite de PID des conteneurs relevée pour kind ; le reste du fichier reste à podman.
"~/.config/containers/containers.conf/kind" = { source = "files/containers.conf", merge = true }
"~/.bashrc/fnox" = { block = 'eval "$(mise exec fnox -- fnox activate bash)"' }

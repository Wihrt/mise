name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Shellcheck
        run: mise exec shellcheck -- shellcheck tasks/bootstrap
      - name: Adopt as global config
        run: |
          mkdir -p ~/.config
          cp -r "$GITHUB_WORKSPACE" ~/.config/mise
      - name: Bootstrap dry run
        working-directory: ${{ runner.temp }}
        run: mise bootstrap --dry-run --yes

  tooling:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Check
        run: mise run check
      - name: Conventional commits
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          b=$(git rev-list --reverse "origin/$BASE_REF..HEAD" | head -1)
          [ -z "$b" ] || mise exec -- cog check "$b..HEAD"

# Fragment: merge into the repo's mise.toml, never replace it (skill repo-tooling, section Mutation).
# The common part (jq, MUTATION_BASE, mutation, check) is in mutation-go.toml: merge it once per repo.
# pytest-gremlins is not a mise tool: it is a pytest plugin in the dev group of pyproject.toml.
# Replace <paquet> with the package directory (e.g. src/demo).

[tasks."mutation:py"]
description = "Mutate the Python files changed since MUTATION_BASE; the verdict is the jq on the report"
run = '''
set -eu
targets=$(git diff --name-only --diff-filter=AMR "$MUTATION_BASE" -- '<paquet>/*.py' | paste -sd, -)
test -n "$targets" || exit 0
uv run pytest -q tests/unit --gremlins --gremlin-cache --gremlin-targets="$targets" --gremlin-report=json
jq -e '.summary.survived == 0' coverage/gremlins/gremlins.json
'''

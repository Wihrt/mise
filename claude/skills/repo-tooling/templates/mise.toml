# Template: merge into the repo's mise.toml, never replace it. Keep every existing
# tool and task; pin versions exactly (check with `mise ls-remote <tool>`).
[tools]
cocogitto = "7.0.0"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
node = "24.22.1"  # lint:renovate runs npx; CI has no global node
prek = "0.5.10"
typos = "1.52.2"

[env]
RENOVATE_VERSION = "44.175.3"

[tasks.setup]
description = "Install the git hooks"
run = "prek install"

[tasks.fmt]
description = "Format the code (replace with the stack formatter)"
run = "echo 'no formatter configured'"

[tasks.lint]
description = "Run every lint:* task"
depends = ["lint:*"]

# The repo owns the test:<ns> tasks (test:go, test:py, ...); `test` runs them all.
# Each test:<ns> also writes a per-test report under .tdd/ (gitignored, see templates/gitignore):
# `check` runs its dependencies in parallel: each test:<ns> writes its JUnit report and its temporary files to paths of its own (for example .tdd/junit-<ns>.xml, passed with `--report` to tdd-gate), never a file another test task also writes.
#   go:   mkdir -p .tdd && gotestsum --junitfile .tdd/junit.xml -- ./...   (gotestsum in [tools])
#   py:   uv run pytest --junitxml=.tdd/junit.xml
#   helm: mkdir -p .tdd && helm unittest -t JUnit -o .tdd/junit.xml <chart>
#   tofu: tofu init -backend=false && mkdir -p .tdd && tofu test -json-into=.tdd/tofu.json
[tasks.test]
description = "Run every test:* task"
depends = ["test:*"]

[tasks.check]
description = "lint then test (CI entrypoint)"
depends = ["lint", "test"]

[tasks."lint:secrets"]
description = "Scan the tree for secrets"
run = "gitleaks git --no-banner --redact"  # git history only: `dir` scans ignored .venv/, node_modules/

[tasks."lint:typos"]
description = "Spell-check the tree"
run = "typos"

[tasks."lint:editorconfig"]
description = "Check files against .editorconfig"
run = "editorconfig-checker"

# hook:* tasks are called only by hooks, never by lint/check (they need their argument).
# prek passes the commit message file as the first argument of the hook entry.
[tasks."hook:commit-msg"]
description = "Check a commit message with cocogitto (commit-msg hook only)"
usage = 'arg "<file>"'
run = 'cog verify --file "$usage_file"'

[tasks."lint:renovate"]
description = "Validate the Renovate config"
run = "npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator --strict"

# Template: merge into the repo's mise.toml, never replace it. Keep every existing
# tool and task; pin versions exactly (check with `mise ls-remote <tool>`).
[tools]
cocogitto = "7.0.0"
editorconfig-checker = "4.0.2"
gitleaks = "8.30.1"
node = "24.22.2"  # lint:renovate runs npx; CI has no global node
prek = "0.5.10"
typos = "1.52.2"

[env]
RENOVATE_VERSION = "44.175.3"

[tasks.setup]
description = "Install the git hooks"
run = "prek install"

[tasks.fmt]
description = "Format the code (replace with the stack formatter)"
run = "echo 'no formatter configured'"

[tasks.lint]
description = "Run every lint:* task"
depends = ["lint:*"]

# The repo owns the test:<ns> tasks (test:go, test:py, ...); `test` runs them all.
# Each test:<ns> also writes a per-test report under .tdd/ (gitignored, see templates/gitignore):
# `check` runs its dependencies in parallel: each test:<ns> writes its JUnit report and its temporary files to paths of its own (for example .tdd/junit-<ns>.xml, passed with `--report` to harness gate), never a file another test task also writes.
#   go:   mkdir -p .tdd && gotestsum --junitfile .tdd/junit.xml -- -count=1 ./...   (gotestsum in [tools])
#   py:   uv run pytest --junitxml=.tdd/junit.xml
#   helm: mkdir -p .tdd && helm unittest -t JUnit -o .tdd/junit.xml <chart>
#   tofu: tofu init -backend=false && mkdir -p .tdd && tofu test -json-into=.tdd/tofu.json
[tasks.test]
description = "Run every test:* task"
depends = ["test:*"]
# Application repo with a Dockerfile (verified 2026-11-18: Go 1.26.9, Python 3.13.18, uv 0.13.9, coverage.py 7.14.0,
# Docker 29.1.3, Compose 2.40.3, mise 2026.11.9). `test` is the task `harness gate coverage --task test` receives.
# Its `run` executes after every test:* task finished (skipped when one fails). Uncomment the `run` of your language:
# go:
# run = '''
# set -eu
# mkdir -p .tdd/cover
# go tool covdata textfmt -i=.tdd/cover-raw/service,.tdd/cover-raw/tool -o .tdd/cover/go.txt
# '''
# py:
# run = '''
# set -eu
# COVERAGE_FILE="$PWD/.tdd/cover/.coverage" uv run coverage combine .tdd/cover/raw
# COVERAGE_FILE="$PWD/.tdd/cover/.coverage" uv run coverage lcov -o .tdd/cover/py.lcov
# '''

# Boundary tests: the TEST HELPER starts and stops the product (compose-dev); this task only prepares the
# measure directories and runs the suite. Unit suites (test:go, test:py) are not instrumented and do not count.
# go (the tests wait for the product themselves: TestMain polls a route):
# [tasks."test:container"]
# description = "Boundary tests; the test helper starts and stops the product"
# run = '''
# set -eu
# rm -rf .tdd/cover-raw
# mkdir -p .tdd/cover-raw/service .tdd/cover-raw/tool bin
# chmod 0777 .tdd/cover-raw/service
# go build -cover -coverpkg=./... -o bin/tool ./cmd/tool
# TOOL_BIN="$PWD/bin/tool" TOOL_COVERDIR="$PWD/.tdd/cover-raw/tool" go test -count=1 ./test/...
# '''
# py (add `[env] UV_PYTHON_PREFERENCE = "only-system"`, else uv picks its own Python over the pinned one):
# [tasks."test:container"]
# description = "Boundary tests: the fixture starts the instrumented product; no conversion here"
# run = '''
# set -eu
# rm -rf .tdd/cover
# mkdir -p .tdd/cover/raw
# chmod 0777 .tdd/cover/raw
# uv run pytest -q tests/container
# '''

[tasks.check]
description = "lint then test (CI entrypoint)"
depends = ["lint", "test"]

[tasks."lint:secrets"]
description = "Scan the tree for secrets"
run = "gitleaks git --no-banner --redact"  # git history only: `dir` scans ignored .venv/, node_modules/

[tasks."lint:typos"]
description = "Spell-check the tree"
run = "typos"

[tasks."lint:editorconfig"]
description = "Check files against .editorconfig"
run = "editorconfig-checker"

# hook:* tasks are called only by hooks, never by lint/check (they need their argument).
# prek passes the commit message file as the first argument of the hook entry.
[tasks."hook:commit-msg"]
description = "Check a commit message with cocogitto (commit-msg hook only)"
usage = 'arg "<file>"'
run = 'cog verify --file "$usage_file"'

[tasks."lint:renovate"]
description = "Validate the Renovate config"
run = "npx --yes --package renovate@${RENOVATE_VERSION} -- renovate-config-validator --strict"

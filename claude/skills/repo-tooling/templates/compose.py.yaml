# Template (Python application). Unverified: written without Docker on 2026-11-14, see skills/compose-dev.
# Replace <db>, <user> and the image digests; keep the service name `app` (the test helpers use it).
services:
  app:
    build: .
    init: true  # as in the trial; `sigterm = True` in .coveragerc is then required (stack-py-app)
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp
    environment:
      PORT: "${PORT:-8080}"
      DATABASE_URL: postgresql://<user>:dev@db:5432/<db>
    ports:
      - "${APP_PORT:-8080}:${PORT:-8080}"
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        # If sync is refused on the read-only root filesystem, use `action: rebuild` here too.
        - action: sync+restart
          path: ./src
          target: /app/src
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./uv.lock

  db:
    image: postgres:18-alpine  # pin the digest
    environment:
      POSTGRES_USER: <user>
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: <db>
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U <user> -d <db>"]
      interval: 2s
      timeout: 2s
      retries: 15


# Fragment: merge into the repo's mise.toml, never replace it (skill repo-tooling, section Mutation).
# The common part (jq, MUTATION_BASE, MUTATION_FULL) is shared by mutation-py.toml and
# mutation-helm.toml: merge it once per repo, whatever the number of fragments.

# --- common part ---
[tools]
jq = "1.8.2"
# --- end common part (tools) ---

[env]
MUTATION_BASE = "{{ get_env(name='MUTATION_BASE', default='origin/main') }}"  # CI sets it to the target branch of the merge request
MUTATION_FULL = "{{ get_env(name='MUTATION_FULL', default='') }}"  # 1: mutate the whole code (on-demand CI), not the diff

# --- Go ---
# [tasks.mutation]: merge it once per mise.toml, whatever the number of fragments (a monorepo service keeps it too).
[tasks.mutation]
description = "Run every mutation:* task"
depends = ["mutation:*"]

[tools."github:go-gremlins/gremlins"]
version = "0.6.0"

[tasks."mutation:go"]
description = "Mutate the Go files changed since MUTATION_BASE, or everything with MUTATION_FULL=1; the verdict is the jq on the report"
run = '''
set -eu
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=diff.relative GIT_CONFIG_VALUE_0=true  # paths relative to the module, as gremlins expects
mkdir -p .tdd
if [ "${MUTATION_FULL:-}" = 1 ]; then
  gremlins unleash -o .tdd/mutation-go.json
else
  [ -n "$(git diff --name-only --diff-filter=AMR "$MUTATION_BASE" -- '*.go')" ] || exit 0
  gremlins unleash --diff "$MUTATION_BASE" -o .tdd/mutation-go.json
fi
jq -e '.mutants_lived == 0 and .mutants_not_covered == 0' .tdd/mutation-go.json
'''

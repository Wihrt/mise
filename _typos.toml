# typos config. typos targets code identifiers.
# The repo prose and imported harness content are French (typos is English-only),
# so those paths are excluded rather than rewritten.
[files]
extend-exclude = [
  "README.md",
  "config.toml",
  "tasks/",
  "docs/",
  ".superpowers/",
  "claude/",
  "rtk/",
]

[default.extend-words]
# `dette initiale` is the reason the baseline writes into COVERAGE.md.
initiale = "initiale"
